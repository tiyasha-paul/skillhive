<!DOCTYPE html>
<html>

<head>
    <title>SkillHive Tracker</title>
    <style>
        body {
            width: 340px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 16px;
            background-color: #020617;
            /* Slate 950 */
            color: #e2e8f0;
        }

        .header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid #1e293b;
        }

        .logo {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        h1 {
            font-size: 16px;
            font-weight: 600;
            margin: 0;
            color: #f8fafc;
            letter-spacing: -0.025em;
        }

        .card {
            background: #0f172a;
            /* Slate 900 */
            border: 1px solid #1e293b;
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            margin-bottom: 16px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            text-align: center;
            margin-bottom: 20px;
        }

        .stat-item h2 {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 4px 0;
            letter-spacing: -0.025em;
        }

        .stat-item p {
            font-size: 11px;
            color: #94a3b8;
            margin: 0;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.05em;
        }

        .text-green {
            color: #4ade80;
        }

        .text-yellow {
            color: #fbbf24;
        }

        .text-red {
            color: #f87171;
        }

        .chart-container {
            margin-top: 12px;
        }

        .bar-chart {
            display: flex;
            height: 8px;
            width: 100%;
            background-color: #1e293b;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .bar-segment {
            height: 100%;
        }

        .bar-green {
            background-color: #22c55e;
        }

        .bar-yellow {
            background-color: #eab308;
        }

        .bar-red {
            background-color: #ef4444;
        }

        .chart-legend {
            display: flex;
            justify-content: center;
            gap: 16px;
            font-size: 11px;
            color: #94a3b8;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="logo.png" class="logo" alt="Logo">
        <h1>SkillHive Focus</h1>
    </div>

    <div class="card">
        <div class="stats-grid">
            <div class="stat-item">
                <h2 id="learning-time" class="text-green">--</h2>
                <p>Learning</p>
            </div>
            <div class="stat-item">
                <h2 id="mixed-time" class="text-yellow">--</h2>
                <p>Mixed</p>
            </div>
            <div class="stat-item">
                <h2 id="distraction-time" class="text-red">--</h2>
                <p>Distract</p>
            </div>
        </div>

        <div class="chart-container">
            <div class="bar-chart" id="day-chart">
                <!-- Segments injected by JS -->
            </div>
            <div class="chart-legend">
                <div class="legend-item">
                    <div class="dot bar-green"></div> Learn
                </div>
                <div class="legend-item">
                    <div class="dot bar-yellow"></div> Mixed
                </div>
                <div class="legend-item">
                    <div class="dot bar-red"></div> Distract
                </div>
            </div>
        </div>
    </div>



    <script src="popup.js"></script>
</body>

</html>
