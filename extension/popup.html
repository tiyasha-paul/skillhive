<!DOCTYPE html>
<html>
<head>
    <title>SkillHive Tracker</title>
    <style>
        body {
            width: 320px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 16px;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
        }
        h2 {
            margin-top: 0;
            font-size: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }
        .card {
            background-color: #1e293b; /* Slate 800 */
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }
        .card label {
            font-size: 12px;
            color: #94a3b8; /* Slate 400 */
            display: block;
            margin-bottom: 4px;
        }
        .card .value {
            font-size: 20px;
            font-weight: bold;
        }
        .learning { color: #4ade80; }
        .distraction { color: #f87171; }
        .open-dashboard {
            width: 100%;
            padding: 10px;
            background-color: #3b82f6; /* Blue 500 */
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background 0.2s;
        }
        .open-dashboard:hover {
            background-color: #2563eb; /* Blue 600 */
        }
    </style>
</head>
<body>
    <h2>
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
        SkillHive Tracker
    </h2>
    
    <div class="stats-grid">
        <div class="card">
            <label>Learning</label>
            <div id="learning-time" class="value learning">0m</div>
        </div>
        <div class="card">
            <label>Distraction</label>
            <div id="distraction-time" class="value distraction">0m</div>
        </div>
    </div>

    <button id="open-dashboard" class="open-dashboard">Open Dashboard</button>

    <script src="popup.js"></script>
</body>
</html>
